name: palseapp
description: "A new Flutter project."
publish_to: 'none' # Remove this line if you wish to publish to pub.dev

version: 1.0.0+1

environment:
  sdk: ^3.6.1

dependencies:
  flutter:
    sdk: flutter
  firebase_core: ^3.12.1
  firebase_auth: ^5.5.1
  firebase_messaging: ^15.2.4
  cloud_firestore: ^5.6.5
  firebase_storage: ^12.4.4
  google_sign_in: ^6.2.2

  provider: ^6.1.2
  image_picker: ^1.1.2
  shared_preferences: ^2.5.1
  cupertino_icons: ^1.0.8
  go_router: ^14.8.0
  intl: ^0.20.2

  geolocator: ^13.0.2
  geocoding: ^3.0.0
  flutter_map: ^8.0.0

  dio: ^5.8.0+1

  flutter_svg: ^2.0.17

  cached_network_image: ^3.4.1
  purchases_flutter: ^8.5.1

dev_dependencies:
  flutter_test:
    sdk: flutter

  package_rename: ^1.8.0

 
  flutter_lints: ^5.0.0

flutter:

  uses-material-design: true

  assets:
    - assets/vectors/
    - assets/images/


package_rename_config:
  android:
    package_name: "com.orderbros.palse"
  ios:
    package_name: "com.alpkaan.dostumolsana"
